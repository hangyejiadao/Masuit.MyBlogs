name: Deploy Carousel Script

on:
  push:
    branches: [master]
    paths:
      - 'src/Masuit.MyBlogs.Core/wwwroot/Assets/banner/carousel.js'
      - '.github/workflows/deploy-carousel.yml'
  workflow_dispatch:

concurrency:
  group: deploy-carousel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package carousel script
        run: tar -czf carousel.tar.gz -C src/Masuit.MyBlogs.Core/wwwroot/Assets/banner carousel.js

      - name: Upload script archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: carousel.tar.gz
          target: /tmp
          overwrite: true
          timeout: 60s
          command_timeout: 2m

      - name: Publish carousel script
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/work/myblogs' }}
          RELEASE_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DEPLOY_PATH,RELEASE_ID
          script: |
            set -eu
            : "${DEPLOY_PATH:=/home/work/myblogs}"
            case "$RELEASE_ID" in
              ''|*[!a-f0-9]*)
                echo "Invalid release id." >&2
                exit 1
                ;;
            esac

            ARCHIVE=/tmp/carousel.tar.gz
            STAGING=$(mktemp -d "/tmp/myblogs-carousel-$RELEASE_ID.XXXXXX")
            DESTINATION="$DEPLOY_PATH/appwwwroot/Assets/banner/carousel.js"
            trap 'rm -rf "$STAGING" "$ARCHIVE"' EXIT

            test -s "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$STAGING"
            test -s "$STAGING/carousel.js"

            sudo mkdir -p "$(dirname "$DESTINATION")"
            sudo install -o root -g root -m 644 "$STAGING/carousel.js" "$DESTINATION"
            sudo cmp -s "$STAGING/carousel.js" "$DESTINATION"
            sudo sha256sum "$DESTINATION"
            echo "Carousel script published to $DESTINATION"