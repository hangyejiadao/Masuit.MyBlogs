name: Deploy Dashboard

on:
  push:
    branches: [master]
    paths:
      - 'front/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: front
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build dashboard
        working-directory: front
        run: npm run build

      - name: Package dashboard
        run: tar -czf dashboard.tar.gz -C src/Masuit.MyBlogs.Core/wwwroot dashboard

      - name: Upload dashboard release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: dashboard.tar.gz
          target: /tmp
          overwrite: true
          timeout: 60s
          command_timeout: 2m

      - name: Publish dashboard to mounted wwwroot
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/myblogs' }}
          RELEASE_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DEPLOY_PATH,RELEASE_ID
          script: |
            set -eu
            case "$RELEASE_ID" in
              ''|*[!a-f0-9]*)
                echo "Invalid dashboard release id." >&2
                exit 1
                ;;
            esac

            ARCHIVE="/tmp/dashboard.tar.gz"
            STAGING="/tmp/myblogs-dashboard-$RELEASE_ID"
            DESTINATION="$DEPLOY_PATH/appwwwroot/dashboard"
            trap 'rm -rf "$STAGING" "$ARCHIVE"' EXIT

            test -f "$ARCHIVE"
            mkdir -p "$STAGING"
            tar -xzf "$ARCHIVE" -C "$STAGING"
            test -s "$STAGING/dashboard/index.html"

            sudo mkdir -p "$DESTINATION"
            sudo rsync -rlt --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
              "$STAGING/dashboard/" "$DESTINATION/"

            test -s "$DESTINATION/index.html"
            echo "Dashboard published to $DESTINATION"
