name: Deploy Backend

# ---------------------------------------------------------------------------
# Builds the backend Docker image, pushes it to GHCR, then refreshes the app
# image of the existing compose stack on the server and recreates only the
# `app` service. The database, Redis, volumes and nginx config are untouched.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST   - e.g. 49.51.199.210
#   SERVER_USER   - e.g. ubuntu  (needs docker access or passwordless sudo)
#   SERVER_SSH_KEY - private SSH key that can log in to the server
#   SERVER_PORT   - optional, defaults to 22
#   QQ_SMTP_AUTH_CODE - QQ Mail SMTP authorization code for hangyejialin@qq.com
#
# Optional repository variables:
#   DEPLOY_PATH   - compose directory on the server, defaults to /opt/myblogs
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1) Build the image and push it to GitHub Container Registry.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # GHCR requires an all-lowercase image name. The `sha-` prefix must match
      # the tag produced by docker/metadata-action's `type=sha,format=long`
      # below; otherwise the deploy job asks for a tag that was never pushed.
      image: ${{ env.REGISTRY }}/${{ steps.name.outputs.lower }}:sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: name
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.name.outputs.lower }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 2) Deploy to the server: retag the freshly built image as the local tag the
  #    production compose file references, then recreate only the app service.
  # -------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          # Directory that holds the production docker-compose.yml.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/myblogs' }}
          # Local tag the compose file references. The freshly built image is
          # retagged onto it, so docker-compose.yml never has to change.
          LOCAL_IMAGE: myblogs/app:latest
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: IMAGE,DEPLOY_PATH,LOCAL_IMAGE
          # Do NOT enable script_stop here: drone-ssh implements it by splitting
          # the script into one line per command and appending an exit-code guard
          # after every line. That guard also runs after an `if <test>; then` line,
          # where $? is the test's own status, so a false test aborts the deploy
          # immediately with exit code 1 and no output at all.
          # The script already starts with `set -e`, which gives correct
          # stop-on-error semantics for multi-line if/else and for/do blocks.
          script: |
            set -e
            : "${DEPLOY_PATH:=/opt/myblogs}"
            : "${LOCAL_IMAGE:=myblogs/app:latest}"
            cd "$DEPLOY_PATH"
            echo "Deploying $IMAGE to $DEPLOY_PATH (local tag: $LOCAL_IMAGE)"

            # Docker access: use the daemon directly when the user is in the
            # 'docker' group, otherwise fall back to passwordless sudo.
            if docker info >/dev/null 2>&1; then
              SUDO=""
            elif sudo -n docker info >/dev/null 2>&1; then
              SUDO="sudo"
            else
              echo "ERROR: no access to the Docker daemon." >&2
              echo "Fix on the server: sudo usermod -aG docker \$USER   (then reconnect SSH)," >&2
              echo "or grant passwordless sudo to the deploy user." >&2
              exit 1
            fi
            echo "Docker access: ${SUDO:-(direct)}"

            # Host port the compose file publishes, used by the readiness check.
            APP_PORT=$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]')
            : "${APP_PORT:=5000}"

            # Keep the release that is currently live so it can be restored with
            #   docker tag myblogs/app:previous myblogs/app:latest
            #   docker compose up -d --no-build app
            if $SUDO docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1; then
              $SUDO docker tag "$LOCAL_IMAGE" "myblogs/app:previous"
            fi

            echo "Pulling $IMAGE"
            $SUDO docker pull "$IMAGE"

            # Only the app image is swapped: the compose file pins a local tag, and
            # db / redis / volumes / nginx keep running exactly as they are.
            $SUDO docker tag "$IMAGE" "$LOCAL_IMAGE"

            STATIC_CONTAINER=$($SUDO docker create "$LOCAL_IMAGE")
            trap '$SUDO docker rm -f "$STATIC_CONTAINER" >/dev/null 2>&1 || true' EXIT
            $SUDO mkdir -p "$DEPLOY_PATH/appwwwroot/Assets/banner" "$DEPLOY_PATH/appwwwroot/Scripts/global"
            $SUDO docker cp "$STATIC_CONTAINER:/app/wwwroot/Assets/banner/carousel.js" "$DEPLOY_PATH/appwwwroot/Assets/banner/carousel.js"
            $SUDO docker cp "$STATIC_CONTAINER:/app/wwwroot/Scripts/global/functions.js" "$DEPLOY_PATH/appwwwroot/Scripts/global/functions.js"
            $SUDO docker rm "$STATIC_CONTAINER"
            trap - EXIT

            $SUDO docker compose up -d --no-build app

            # The image has no HEALTHCHECK, so poll the published port instead.
            # On a connection failure curl both prints 000 and exits non-zero, so
            # the status must come from the fallback assignment, not from `|| echo`.
            echo "Waiting for http://127.0.0.1:$APP_PORT/ to answer..."
            ready=""
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:$APP_PORT/" 2>/dev/null) || code="000"
              echo "  [$i/30] http=$code"
              if [ "$code" != "000" ]; then
                ready=1
                break
              fi
              sleep 5
            done
            if [ -z "$ready" ]; then
              echo "ERROR: the app did not answer on port $APP_PORT within 150s." >&2
              $SUDO docker compose logs --tail=80 app
              exit 1
            fi

            $SUDO docker compose ps
            echo "Deployment finished."
      - name: Send deployment success email
        if: success()
        continue-on-error: true
        env:
          SMTP_USERNAME: hangyejialin@qq.com
          SMTP_PASSWORD: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          SMTP_SERVER: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USE_SSL: "true"
          MAIL_FROM: hangyejialin@qq.com
          MAIL_TO: hangyejialin@qq.com
          DEPLOYED_IMAGE: ${{ needs.build.outputs.image }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGERED_BY: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_SERVER",
              "SMTP_PORT",
              "MAIL_FROM",
              "MAIL_TO",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required environment variables: {', '.join(missing)}")

          sha = os.environ["COMMIT_SHA"]
          body = "\n".join([
              "Masuit.MyBlogs 后端部署成功。",
              "",
              f"仓库：{os.environ['REPOSITORY']}",
              f"分支：{os.environ['BRANCH']}",
              f"提交：{sha}",
              f"触发人：{os.environ['TRIGGERED_BY']}",
              f"镜像：{os.environ['DEPLOYED_IMAGE']}",
              f"运行记录：{os.environ['RUN_URL']}",
          ])

          message = EmailMessage()
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["MAIL_TO"]
          message["Subject"] = f"[部署成功] Masuit.MyBlogs {sha[:7]}"
          message.set_content(body)

          server = os.environ["SMTP_SERVER"]
          port = int(os.environ["SMTP_PORT"])
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]

          if os.environ.get("SMTP_USE_SSL", "true").lower() == "true":
              with smtplib.SMTP_SSL(server, port, context=ssl.create_default_context(), timeout=30) as smtp:
                  smtp.login(username, password)
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(server, port, timeout=30) as smtp:
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.login(username, password)
                  smtp.send_message(message)
          PY
