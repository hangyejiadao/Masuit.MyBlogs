name: Deploy Backend

# ---------------------------------------------------------------------------
# Builds the backend Docker image, pushes it to GHCR, then refreshes the app
# image of the existing compose stack on the server and recreates only the
# `app` service. The database, Redis, volumes and nginx config are untouched.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST   - e.g. 49.51.199.210
#   SERVER_USER   - e.g. ubuntu  (needs docker access or passwordless sudo)
#   SERVER_SSH_KEY - private SSH key that can log in to the server
#   SERVER_PORT   - optional, defaults to 22
#   QQ_SMTP_AUTH_CODE - QQ Mail SMTP authorization code for hangyejialin@qq.com
#
# Optional repository variables:
#   DEPLOY_PATH   - compose directory on the server, defaults to /home/work/myblogs
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1) Build the image and push it to GitHub Container Registry.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Deploy the unique build tag, not a SHA tag shared by repeated builds.
      image: ${{ env.REGISTRY }}/${{ steps.name.outputs.lower }}:${{ steps.release.outputs.version }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release metadata
        id: release
        run: python3 deploy/build_backend.py --metadata-only --github-output "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: name
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.name.outputs.lower }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.version }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            RELEASE_METADATA_BASE64=${{ steps.release.outputs.metadata-base64 }}
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            RELEASE_COMMIT=${{ steps.release.outputs.commit }}
            RELEASE_BUILT_AT=${{ steps.release.outputs.built-at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.created=${{ steps.release.outputs.built-at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 2) Deploy to the server: retag the freshly built image as the local tag the
  #    production compose file references, then recreate only the app service.
  # -------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          # Directory that holds the production docker-compose.yml.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/work/myblogs' }}
          # Local tag the compose file references. The freshly built image is
          # retagged onto it, so docker-compose.yml never has to change.
          LOCAL_IMAGE: myblogs/app:latest
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: IMAGE,DEPLOY_PATH,LOCAL_IMAGE,EXPECTED_COMMIT,EXPECTED_VERSION
          # Do NOT enable script_stop here: drone-ssh implements it by splitting
          # the script into one line per command and appending an exit-code guard
          # after every line. That guard also runs after an `if <test>; then` line,
          # where $? is the test's own status, so a false test aborts the deploy
          # immediately with exit code 1 and no output at all.
          # The script already starts with `set -e`, which gives correct
          # stop-on-error semantics for multi-line if/else and for/do blocks.
          script: |
            set -e
            : "${DEPLOY_PATH:=/home/work/myblogs}"
            : "${LOCAL_IMAGE:=myblogs/app:latest}"
            cd "$DEPLOY_PATH"
            echo "Deploying $IMAGE to $DEPLOY_PATH (local tag: $LOCAL_IMAGE)"

            # Docker access: use the daemon directly when the user is in the
            # 'docker' group, otherwise fall back to passwordless sudo.
            if docker info >/dev/null 2>&1; then
              SUDO=""
            elif sudo -n docker info >/dev/null 2>&1; then
              SUDO="sudo"
            else
              echo "ERROR: no access to the Docker daemon." >&2
              echo "Fix on the server: sudo usermod -aG docker \$USER   (then reconnect SSH)," >&2
              echo "or grant passwordless sudo to the deploy user." >&2
              exit 1
            fi
            echo "Docker access: ${SUDO:-(direct)}"

            # Support both the existing production `app` stack and repository `web`.
            # The latter uses ${IMAGE}; explicitly pass the tag to sudo as well.
            compose() { $SUDO env IMAGE="$LOCAL_IMAGE" docker compose "$@"; }
            services=$(compose config --services)
            if printf '%s\n' "$services" | grep -qx app; then
              APP_SERVICE=app
            elif printf '%s\n' "$services" | grep -qx web; then
              APP_SERVICE=web
            else
              echo "ERROR: compose has no app or web service." >&2
              exit 1
            fi

            # Host port the compose file publishes, used by the readiness check.
            APP_PORT=$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]')
            : "${APP_PORT:=5000}"

            # Keep the release that is currently live so it can be restored with
            #   docker tag myblogs/app:previous myblogs/app:latest
            #   docker compose up -d --no-build <app-or-web>
            if $SUDO docker image inspect "$LOCAL_IMAGE" >/dev/null 2>&1; then
              $SUDO docker tag "$LOCAL_IMAGE" "myblogs/app:previous"
            fi

            echo "Pulling $IMAGE"
            $SUDO docker pull "$IMAGE"

            # Only the backend image is swapped using the local tag;
            # db / redis / volumes / nginx keep running exactly as they are.
            $SUDO docker tag "$IMAGE" "$LOCAL_IMAGE"
            compose up -d --no-build --no-deps --force-recreate "$APP_SERVICE"
            expected_image=$($SUDO docker image inspect "$IMAGE" --format '{{.Id}}')
            container=$(compose ps -q "$APP_SERVICE")
            test -n "$container"
            actual_image=$($SUDO docker inspect "$container" --format '{{.Image}}')
            if [ "$actual_image" != "$expected_image" ]; then
              echo "ERROR: running container does not use the newly built image." >&2
              exit 1
            fi

            # Require HTTP 200 AND this build version; any response is not readiness.
            echo "Waiting for http://127.0.0.1:$APP_PORT/version.json to answer with version $EXPECTED_VERSION..."
            ready=""
            for i in $(seq 1 30); do
              body=$(mktemp)
              code=$(curl -fsS -o "$body" -w '%{http_code}' -m 5 "http://127.0.0.1:$APP_PORT/version.json" 2>/dev/null) || code="000"
              echo "  [$i/30] version.json http=$code"
              if [ "$code" = "200" ] &&
                 grep -Fq "\"version\": \"$EXPECTED_VERSION\"" "$body" &&
                 grep -Fq "\"commit\": \"$EXPECTED_COMMIT\"" "$body"; then
                ready=1
                rm -f "$body"
                break
              fi
              rm -f "$body"
              sleep 5
            done
            if [ -z "$ready" ]; then
              echo "ERROR: expected release metadata was not served on port $APP_PORT within 150s." >&2
              compose logs --tail=80 "$APP_SERVICE"
              exit 1
            fi

            compose ps
            echo "Deployment finished."
      - name: Send deployment success email
        if: success()
        continue-on-error: true
        env:
          SMTP_USERNAME: hangyejialin@qq.com
          SMTP_PASSWORD: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          SMTP_SERVER: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USE_SSL: "true"
          MAIL_FROM: hangyejialin@qq.com
          MAIL_TO: hangyejialin@qq.com
          DEPLOYED_IMAGE: ${{ needs.build.outputs.image }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGERED_BY: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = [
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_SERVER",
              "SMTP_PORT",
              "MAIL_FROM",
              "MAIL_TO",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required environment variables: {', '.join(missing)}")

          sha = os.environ["COMMIT_SHA"]
          body = "\n".join([
              "Masuit.MyBlogs 后端部署成功。",
              "",
              f"仓库：{os.environ['REPOSITORY']}",
              f"分支：{os.environ['BRANCH']}",
              f"提交：{sha}",
              f"触发人：{os.environ['TRIGGERED_BY']}",
              f"镜像：{os.environ['DEPLOYED_IMAGE']}",
              f"运行记录：{os.environ['RUN_URL']}",
          ])

          message = EmailMessage()
          message["From"] = os.environ["MAIL_FROM"]
          message["To"] = os.environ["MAIL_TO"]
          message["Subject"] = f"[部署成功] Masuit.MyBlogs {sha[:7]}"
          message.set_content(body)

          server = os.environ["SMTP_SERVER"]
          port = int(os.environ["SMTP_PORT"])
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]

          if os.environ.get("SMTP_USE_SSL", "true").lower() == "true":
              with smtplib.SMTP_SSL(server, port, context=ssl.create_default_context(), timeout=30) as smtp:
                  smtp.login(username, password)
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(server, port, timeout=30) as smtp:
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.login(username, password)
                  smtp.send_message(message)
          PY
