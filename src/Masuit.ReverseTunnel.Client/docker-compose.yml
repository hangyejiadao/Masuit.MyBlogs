services:
  reverse-tunnel-client:
    build: .
    environment:
      # Docker Desktop may inject the host proxy into containers. The tunnel
      # client must connect directly to the public server, not 127.0.0.1 in the container.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
